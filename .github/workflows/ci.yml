name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-policy:
    name: pr-policy
    runs-on: ubuntu-24.04
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: 核对 PR 长度与唯一 Issue
        uses: actions/github-script@v7
        with:
          script: |
            // 直接读取事件数据，避免将 PR 正文插入可执行脚本。
            const body = context.payload.pull_request.body || '';
            // 只排除已闭合的围栏代码块；行内代码和未闭合围栏仍计数。
            const prose = [];
            let fence = null;
            let pending = [];
            for (const line of body.match(/[^\n]*\n|[^\n]+$/gu) || []) {
              const text = line.replace(/\r?\n$/u, '');
              if (!fence) {
                const opening = /^ {0,3}(`{3,}|~{3,})(.*)$/u.exec(text);
                if (opening && (opening[1][0] !== '`' || !opening[2].includes('`'))) {
                  fence = { marker: opening[1][0], width: opening[1].length };
                  pending = [line];
                } else {
                  prose.push(line);
                }
                continue;
              }
              pending.push(line);
              const closing = /^ {0,3}(`+|~+)[ \t]*$/u.exec(text);
              if (closing && closing[1][0] === fence.marker && closing[1].length >= fence.width) {
                // 闭合围栏后的换行仍属于正文。
                prose.push(line.slice(text.length));
                fence = null;
                pending = [];
              }
            }
            if (fence) prose.push(...pending);
            const characterCount = Array.from(prose.join('')).length;
            core.info(`PR 描述字符数：${characterCount}（已排除闭合代码块）。`);
            if (characterCount > 500) {
              core.setFailed('PR 描述过长，请精简至 400 字以内');
              return;
            }
            const firstLine = body.split(/\r?\n/u)[0];
            const first = /^(Closes|Fixes) #([1-9]\d*)$/iu.exec(firstLine);
            if (!first) {
              core.setFailed('PR 首行必须为 Closes #N 或 Fixes #N。');
              return;
            }
            const closingReference = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b[\s:]*((?:[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)?#\d+|https?:\/\/[^\s<>]+\/(?:issues|pull)\/\d+)/giu;
            const references = [...body.matchAll(closingReference)];
            if (references.length !== 1 || references[0].index !== 0 ||
                references[0][1] !== `#${first[2]}`) {
              core.setFailed('PR 正文只能关闭当前仓库的一个 Issue，请使用 #N。');
              return;
            }
            const issueNumber = Number(first[2]);
            if (!Number.isSafeInteger(issueNumber)) {
              core.setFailed('Issue 编号无效。');
              return;
            }
            const { data: issue } = await github.rest.issues.get({
              ...context.repo,
              issue_number: issueNumber
            });
            if (issue.pull_request || issue.state !== 'open') {
              core.setFailed('关联项必须是当前仓库尚未关闭的 Issue，不能是 PR。');
              return;
            }
            core.info(`已关联 ${context.repo.owner}/${context.repo.repo} 的未关闭 Issue #${issueNumber}。`);

  changes:
    name: changes
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      edge_cpp: ${{ steps.filter.outputs.edge_cpp }}
      cloud_storage: ${{ steps.filter.outputs.cloud_storage }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            edge_cpp:
              - 'src/**'
              - 'tests/**'
              - 'CMakeLists.txt'
              - 'cmake/**'
            cloud_storage:
              - 'cloud-storage/**'

  edge-cpp:
    name: edge-cpp
    needs: changes
    if: ${{ needs.changes.outputs.edge_cpp == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Detect C++ sources beyond the initial skeleton
        id: sources
        shell: bash
        run: |
          if find src tests -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' -o -name '*.c' -o -name '*.hpp' -o -name '*.hh' -o -name '*.hxx' -o -name '*.h' \) -print -quit | grep -q .; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Initial skeleton has no C++ sources; no C++ build is run.'
          fi
      - name: Install native dependencies and ARM64 compiler
        if: steps.sources.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libgtest-dev g++-aarch64-linux-gnu
      - name: Native CMake build and offline CTest
        if: steps.sources.outputs.present == 'true'
        run: |
          cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-native --parallel 2
          ctest --test-dir build-native --output-on-failure --no-tests=error
      - name: ARM64 cross-compile without target test execution
        if: steps.sources.outputs.present == 'true'
        run: |
          cmake -S . -B build-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64-toolchain.cmake -DBUILD_TESTING=OFF
          cmake --build build-arm64 --parallel 2

  cloud-storage:
    name: cloud-storage
    needs: changes
    if: ${{ needs.changes.outputs.cloud_storage == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python3 -m pip install -r cloud-storage/requirements.txt pytest httpx
      - name: Check Python syntax
        run: python3 -m py_compile cloud-storage/server.py
      - name: Run offline pytest with the initial empty-file exception
        shell: bash
        run: |
          set +e
          python3 -m pytest -q cloud-storage
          result=$?
          set -e
          if [ "$result" -eq 5 ]; then
            python3 - <<'PY'
          from pathlib import Path
          root = Path('cloud-storage')
          sources = list(root.rglob('*.py'))
          initial = sources == [root / 'server.py'] and (root / 'server.py').stat().st_size == 0
          if not initial:
              raise SystemExit('Python implementation or additional Python files require collected tests.')
          print('Only the initial empty server.py exists; pytest has no tests yet.')
          PY
          else
            exit "$result"
          fi

  ci-gate:
    name: ci-gate
    needs: [pr-policy, changes, edge-cpp, cloud-storage]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require policy, change detection and every selected component
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          needs = json.loads(os.environ['NEEDS_JSON'])
          for job in ('pr-policy', 'changes'):
              if needs[job]['result'] != 'success':
                  raise SystemExit(f"{job} did not succeed: {needs[job]['result']}")
          for job, flag in (('edge-cpp', 'edge_cpp'), ('cloud-storage', 'cloud_storage')):
              selected = needs['changes']['outputs'].get(flag)
              if selected not in ('true', 'false'):
                  raise SystemExit(f'Invalid or missing change-filter output: {flag}')
              expected = 'success' if selected == 'true' else 'skipped'
              actual = needs[job]['result']
              if actual != expected:
                  raise SystemExit(f'{job}: expected {expected}, got {actual}')
          print('All required PR checks passed.')
          PY
