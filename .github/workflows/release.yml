name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: verify-and-package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native dependencies and ARM64 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libstb-dev libgtest-dev nlohmann-json3-dev g++-aarch64-linux-gnu
      - name: Install ARM64 FFmpeg development libraries
        run: |
          sudo dpkg --add-architecture arm64
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          else
            sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          fi
          sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y libavformat-dev:arm64 libavcodec-dev:arm64 libavutil-dev:arm64 libswscale-dev:arm64
      - name: Native CMake build and offline CTest
        run: |
          cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-native --parallel 2
          ctest --test-dir build-native --output-on-failure --no-tests=error
      - name: Install Python dependencies
        run: python3 -m pip install -r cloud-storage/requirements.txt pytest httpx
      - name: Strict Python validation
        run: |
          python3 -m py_compile cloud-storage/server.py
          python3 -m pytest -q cloud-storage
      - name: ARM64 cross-compile
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig
        run: |
          cmake -S . -B build-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64-toolchain.cmake -DBUILD_TESTING=OFF
          cmake --build build-arm64 --parallel 2
      - name: Package the installed ARM64 executable, config and service
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cmake --install build-arm64 --prefix staging
          test -x staging/bin/edge-vision-analyzer
          install -D config/config.example.json staging/config/config.example.json
          install -D deploy/edge-vision.service staging/deploy/edge-vision.service
          install -D deploy/journald-edge.conf staging/deploy/journald-edge.conf
          install -D deploy/fluent-bit.conf staging/deploy/fluent-bit.conf
          archive="edge-vision-analyzer-${RELEASE_TAG}-arm64.tar.gz"
          tar -czf "$archive" -C staging .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Save the validated release archive
        uses: actions/upload-artifact@v4
        with:
          name: edge-vision-analyzer-arm64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  publish:
    name: publish-release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: edge-vision-analyzer-arm64
          path: dist
      - name: Create the release and upload its archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "dist/edge-vision-analyzer-${RELEASE_TAG}-arm64.tar.gz" --verify-tag --generate-notes --title "$RELEASE_TAG"
