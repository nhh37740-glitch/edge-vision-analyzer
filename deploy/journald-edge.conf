# PATCH-008 deployment template; acceptance status is recorded in docs/benchmarks.md.
# Default-namespace drop-in: /etc/systemd/journald.conf.d/zz-edge-vision.conf.
# Sort after distro syslog.conf to prevent a second rsyslog/ramlog file path.
# This affects the default system journal, not only edge-vision.service.
# Volatile journal data lives below /run/log/journal and is lost on reboot.
# RuntimeMaxUse controls journal file retention. Only archived files are removed;
# active-file/rotation granularity can leave usage above 20M. It is not an exact cap.
# Do not add application log files, persistent forwarding, or cleanup scripts.
# https://www.freedesktop.org/software/systemd/man/latest/journald.conf.html
[Journal]
Storage=volatile
RuntimeMaxUse=20M
ForwardToSyslog=no
