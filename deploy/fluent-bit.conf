# PATCH-008 deployment template; acceptance status is recorded in docs/benchmarks.md.
# Read only edge-vision.service journal records and send a JSON array to the PC.
# Replace the example LAN host in the machine's deployment copy when needed.
# Memory-only chunks: no storage.path, cursor DB, filesystem backlog, or DLQ files.
# Mem_Buf_Limit bounds input buffering, not total Fluent Bit RSS; the input pauses
# when the limit is reached. A single append may exceed the configured threshold.
# Retry_Limit 1 permits at most one retry, then the failed chunk is discarded.
# Journal rotation, collector restarts and network failures can lose log records;
# delivery is not guaranteed and HTTP retries can duplicate a batch.
# https://docs.fluentbit.io/manual/data-pipeline/inputs/systemd
# https://docs.fluentbit.io/manual/data-pipeline/outputs/http
# https://docs.fluentbit.io/manual/administration/buffering-and-storage
# https://docs.fluentbit.io/manual/administration/backpressure
# https://docs.fluentbit.io/manual/administration/scheduling-and-retries
[SERVICE]
    Flush           1
    Log_Level       info

[INPUT]
    Name            systemd
    Tag             edge.logs
    Systemd_Filter  _SYSTEMD_UNIT=edge-vision.service
    Read_From_Tail  On
    Mem_Buf_Limit   2MB
    storage.type    memory

[OUTPUT]
    Name            http
    Match           edge.logs
    Host            10.10.10.1
    Port            8090
    URI             /api/v1/logs
    Format          json
    Header          Content-Type application/json
    Retry_Limit     1
