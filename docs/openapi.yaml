openapi: 3.0.3
info:
  title: Edge Vision Analyzer 边缘与云存储 API
  version: 0.1.0
  description: PATCH-003/007/008/009 两服务设计契约。v0.1-oculus 的 health、stats、config 读取与 source-switch，v1.0-vox 的 snapshot 与 stream，v0.3-nous 的云存储 health/events/images/logs 端点以及 PATCH config 均已实现。LLM/Storage 上游探活已实现，边缘 degraded 仍只在 CaptureNode 失败时出现。服务仅在同一有线局域网通信；边缘:8081仅实时控制与流媒体，联想PC cloud-storage:8090保存历史事件、图片和接收日志，llama-server:8080仅提供本地推理。不接公有云服务。每个路径单独绑定servers，外部llama-server不在本OpenAPI
    paths中。
tags:
- name: v0.1-oculus
  description: 采集与基础控制面，已实现；2026-11-24 在魔百盒完成本地视频与本地 RTSP 模拟源真机验收，手机流与 LLM 联动已验收。degraded 仍只在 CaptureNode 失败时出现。
- name: v0.2-discern
  description: 检测与 PATCH config 原子热更新已实现并接入运行入口；魔百盒本地视频验收完成。
- name: v0.3-nous
  description: 事件聚合与异步语义分析已实现并接入运行入口；云存储服务由离线 pytest 覆盖，盒到 PC 的 health、事件与图片投递已真机验收，LLM 联动已验收；事件冷却与第二条事件未覆盖。
- name: v1.0-vox
  description: OSD、快照与 MJPEG 已在魔百盒验收；本地 RTSP 模拟源取流已验收；盒端 RTSP 推流输出已验收（H.264/yuv420p、15 FPS）；Fluent Bit／journald 基础日志链路于 2026-11-24 验收；整机重启与长时间运行未验证。
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: 存活、节点线程与LLM/Storage上游健康状态
      tags:
      - v0.1-oculus
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: 检查已有节点状态；仅 CaptureNode 失败时返回200/degraded。LLM与Storage启用时由后台线程立即探测并按约2秒间隔刷新，单次GET <base>/health超时上限500ms：成功报告reachable，失败、超时或非200报告unreachable，首轮完成前短暂报告unknown，关闭时报告disabled。health请求只读缓存、不等待上游，上游不可达不改变边缘200/status，也不触发真实推理或存储写入。
    servers:
    - url: http://192.168.10.11:8081
      description: 魔百盒边缘实时控制与流媒体；此路径只属于边缘端。
  /api/v1/stats:
    get:
      operationId: getStats
      summary: 读取性能与资源统计
      tags:
      - v0.1-oculus
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: 读取性能与资源统计，可包含nullable的soc_temp_c温度观测值；温度字段不承担温控。采集与控制面指标已实现；检测、跳过率等节点接入后填充，dropped_frames已由Issue #55汇入节点队列丢帧累计。
    servers:
    - url: http://192.168.10.11:8081
      description: 魔百盒边缘实时控制与流媒体；此路径只属于边缘端。
  /api/v1/config:
    get:
      operationId: getConfig
      summary: 读取当前生效配置
      tags:
      - v0.1-oculus
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: patchConfig
      summary: 原子热更新检测/LLM/存储的五个允许字段
      tags:
      - v0.2-discern
      x-implementation-status: implemented
      responses:
        '200':
          description: 返回更新后的完整生效配置。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigPatch'
            example:
              detector:
                motion_mad_threshold: 8.0
                conf_threshold: 0.5
              llm:
                enabled: true
                cooldown_sec: 15
              storage:
                enabled: true
      description: v0.2-discern支持检测/LLM四项，v0.3-nous新增storage.enabled。不持久化修改磁盘配置；不支持改源、模型、线程数、端口、storage.endpoint或storage.timeout_sec。整份请求先校验后原子发布；任一字段失败则全部不变。
    servers:
    - url: http://192.168.10.11:8081
      description: 魔百盒边缘实时控制与流媒体；此路径只属于边缘端。
  /api/v1/source/switch:
    post:
      operationId: switchSource
      summary: 在线切换手机流或本地视频源
      tags:
      - v0.1-oculus
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSwitchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceSwitchRequest'
      description: 成功后提交新输入源及 loop；打开或解码初始化失败返回400/INVALID_SOURCE，保留原源继续工作。录制期间禁止切源，同样返回400/INVALID_SOURCE。
    servers:
    - url: http://192.168.10.11:8081
      description: 魔百盒边缘实时控制与流媒体；此路径只属于边缘端。
  /api/v1/snapshot.jpg:
    get:
      operationId: getSnapshot
      summary: 读取最新带 OSD 标注的 JPEG
      tags:
      - v1.0-vox
      x-implementation-status: implemented
      responses:
        '200':
          description: JPEG 二进制。
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: 尚无首帧返回 503；仅请求快照或有活跃流客户端时进行 JPEG 编码。
    servers:
    - url: http://192.168.10.11:8081
      description: 魔百盒边缘实时控制与流媒体；此路径只属于边缘端。
  /api/v1/stream:
    get:
      operationId: getStream
      summary: 订阅实时标注 MJPEG
      tags:
      - v1.0-vox
      x-implementation-status: implemented
      responses:
        '200':
          description: '持续响应；Content-Type: multipart/x-mixed-replace; boundary=frame。每个部分包含 Content-Type:
            image/jpeg，以 --frame 分隔。'
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-cache
          content:
            multipart/x-mixed-replace; boundary=frame:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: HTTP 头发送前若无可用首帧可返回 503/JSON；开始流后不再插入 JSON 错误体，断线由客户端重连。慢客户端不得形成无界队列。
    servers:
    - url: http://192.168.10.11:8081
      description: 魔百盒边缘实时控制与流媒体；此路径只属于边缘端。
  /health:
    servers:
    - url: http://192.168.10.10:8090
      description: 联想 PC cloud-storage；此路径只属于云存储进程。
    get:
      operationId: getStorageHealth
      summary: 云存储数据库连接健康探针
      tags:
      - v0.3-nous
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageHealth'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: 成功返回status=ok、db=connected；数据库未就绪返回503和统一Error。
  /api/v1/events:
    servers:
    - url: http://192.168.10.10:8090
      description: 联想 PC cloud-storage；此路径只属于云存储进程。
    post:
      operationId: createStoredEvent
      summary: 保存干净抓拍与结构化事件
      tags:
      - v0.3-nous
      x-implementation-status: implemented
      responses:
        '201':
          description: 图片与结构化元数据均写入成功后返回201 Created。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEventResponse'
              example:
                status: created
                event_id: evt_1795412000_1
                image_url: /api/v1/images/2026-11-23/evt_1795412000_1.jpg
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      description: 先校验timestamp_ms为必填非负int64整数，0合法；缺失、负值、错误类型/非整数/布尔或越界返回400。合法值早于2025-01-01T00:00:00Z（1735689600000）或晚于9999-12-31T23:59:59.999Z时，使用PC接收本请求时只取一次的当前Unix毫秒；范围内（含两端）保留入站值。选定的同一个有效timestamp_ms同时用于SQLite、历史列表/排序及图片UTC日期，event_id等其他字段不变。将image_base64解码为JPEG，写入storage/images/YYYY-MM-DD/<event_id>.jpg；SQLite保存相对路径和元数据（schema.sql）。不接收调用方路径；event_id限定安全字符且仅服务端生成文件名。重复event_id返回400/EVENT_EXISTS，不覆盖原留存；无效Base64/JPEG/字段返回400，文件/数据库写入失败返回500。
    get:
      operationId: listStoredEvents
      summary: 分页查询历史结构化事件
      tags:
      - v0.3-nous
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredEventsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
          maximum: 100
        description: 每页条数1..100；非法值返回400。
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: 跳过的记录数，必须为非负整数。
      description: 按入库时选定的有效timestamp_ms DESC排序，同毫秒以event_id DESC稳定排序；响应timestamp_ms及image_url中的UTC日期与入库值保持一致。total为数据库全部事件数，不受limit/offset影响。事件含相对image_url，不包含宿主机绝对路径。
  /api/v1/images/{date}/{filename}:
    servers:
    - url: http://192.168.10.10:8090
      description: 联想 PC cloud-storage；此路径只属于云存储进程。
    get:
      operationId: getStoredImage
      summary: 读取历史事件干净JPEG抓拍
      tags:
      - v0.3-nous
      x-implementation-status: implemented
      responses:
        '200':
          description: 留存的未经OSD绘制的原始干净JPEG。
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2026-11-23'
        description: 入库时选定的有效timestamp_ms对应UTC日期YYYY-MM-DD；未对时兜底后须使用PC接收时间对应日期，并校验为真实日历日期。
      - name: filename
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+[.]jpg$
          example: evt_1795412000_1.jpg
        description: 只能是由合法event_id生成的<event_id>.jpg。
      description: 仅在cloud-storage/storage/images根目录下解析日期与文件名；拒绝路径分隔符、..、编码绕过和越出根目录的解析结果。非法路径返回400，图片不存在返回404；仅返回image/jpeg，不返回磁盘路径。
  /api/v1/logs:
    servers:
    - url: http://192.168.10.10:8090
      description: 联想PC cloud-storage日志接口，只在局域网提供。
    post:
      operationId: appendLogs
      summary: 接收Fluent Bit结构化日志批次
      tags:
      - v0.3-nous
      x-implementation-status: implemented
      description: 仅LAN内由PC接收，不代理到边缘。实现约定：按PC接收时的UTC日期，将整个批次的每条原始对象紧凑序列化为UTF-8单行JSON，按数组顺序逐条追加至cloud-storage/storage/logs/YYYY-MM-DD.log；字符串内换行转义。保留原始字段结构，不重命名、删减或补造字段，不依据源时间分文件，不写SQLite。全部追加成功后返回204无响应体；非法JSON/非对象数组返回400，写入失败返回500。追加语义允许重试批次产生重复行。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogBatch'
            example:
            - date: '2026-11-23T05:33:20.123Z'
              MESSAGE: 采集节点已启动
              _SYSTEMD_UNIT: edge-vision.service
      responses:
        '204':
          description: 全部日志对象已追加，无响应体。
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      operationId: tailLogs
      summary: 按PC接收日期查询最近日志行
      tags:
      - v0.3-nous
      x-implementation-status: implemented
      description: 仅查询PC本地cloud-storage/storage/logs/YYYY-MM-DD.log，不向边缘请求或代理日志。date以PC接收UTC日期为准；校验真实日历日期并限定文件位于logs根目录。返回最近tail行，保持这些行原有写入顺序；不足tail行返回全部，空文件返回200空内容，缺文件返回404。非法日期/条数返回400，读取失败返回500；错误沿用统一Error。
      parameters:
      - name: date
        in: query
        required: true
        description: PC接收时UTC日期，必须为YYYY-MM-DD的真实日历日期。
        schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2026-11-23'
      - name: tail
        in: query
        required: false
        description: 最多读取的最近行数，返回仍按原写入顺序排列。
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
      responses:
        '200':
          description: UTF-8 NDJSON文本，每行一条紧凑JSON日志；空文件返回空内容。
          content:
            application/x-ndjson:
              schema:
                type: string
              example: '{"date":"2026-11-23T05:33:20.123Z","MESSAGE":"采集节点已启动","_SYSTEMD_UNIT":"edge-vision.service"}

                '
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              description: 供程序处理的稳定错误码。
              example: INVALID_PARAMETER
            message:
              type: string
              description: 简短错误说明；仅包含必要的错误详情。
              example: motion_mad_threshold must be between 0.0 and 255.0
          required:
          - code
          - message
      required:
      - error
    NodeHealth:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          example: CaptureNode
        state:
          type: string
          enum:
          - starting
          - running
          - stopping
          - stopped
          - failed
          - not_enabled
      required:
      - name
      - state
    UpstreamHealth:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          description: 上游不可达不等于边缘进程死亡；探活只发送GET且不等待真实生成。启用时立即探测一次并按约2秒间隔刷新，单次超时上限500ms；成功为reachable，失败、超时或非200为unreachable，首轮完成前短暂为unknown，关闭时为disabled。
          enum:
          - disabled
          - reachable
          - unreachable
          - unknown
        endpoint:
          type: string
          description: 上游 health 地址；LLM为:8080/health，Storage为:8090/health。
          format: uri
          example: http://192.168.10.10:8080/health
      required:
      - status
      - endpoint
      description: 单个上游的连通状态。由边缘后台探活线程缓存；探活不触发实际生成或写入，上游不可达不改变边缘自身的200与status。魔百盒已验证 health 200、关闭时的 disabled，以及 Storage 指向 PC 时返回 reachable；LLM 的 reachable／unreachable 仍待真机联调。
    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          description: 当前仅 CaptureNode 失败时为 degraded，仍返回 200；LLM/Storage 上游探活已实现，上游不可达只影响各自字段，不会单独触发 degraded。
          enum:
          - ok
          - degraded
        version:
          type: string
          example: v0.1-oculus
        uptime_sec:
          type: number
          minimum: 0
          example: 125.4
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeHealth'
        llm:
          $ref: '#/components/schemas/UpstreamHealth'
        storage:
          $ref: '#/components/schemas/UpstreamHealth'
      required:
      - status
      - version
      - uptime_sec
      - nodes
      - llm
      - storage
    Stats:
      type: object
      additionalProperties: false
      properties:
        capture_fps:
          type: number
          minimum: 0
          example: 14.8
        detect_fps:
          type: number
          minimum: 0
          example: 4.2
        motion_skip_ratio:
          type: number
          minimum: 0
          maximum: 1
          example: 0.72
        avg_infer_ms:
          type: number
          minimum: 0
          example: 84.5
        avg_llm_latency_ms:
          type: number
          minimum: 0
          example: 6210.0
        dropped_frames:
          type: integer
          minimum: 0
          format: int64
          example: 12
          description: 合并Metrics累计与节点队列丢帧（入队丢旧和停止时丢弃）；Issue #55 实现。
        rss_memory_mb:
          type: number
          minimum: 0
          example: 142.6
        soc_temp_c:
          type: number
          format: float
          nullable: true
          description: 可选的SoC摄氏温度；读取Linux /sys/class/thermal/thermal_zone0/temp的毫摄氏度后除以1000，读取或解析失败返回null。仅用于压测观测，不触发温控动作。
          example: 62.5
      required:
      - capture_fps
      - detect_fps
      - motion_skip_ratio
      - avg_infer_ms
      - avg_llm_latency_ms
      - dropped_frames
      - rss_memory_mb
      description: 累计丢帧与运行统计；尚未启用或尚无样本的阶段指标为 0，dropped_frames 已由 Issue #55 汇入节点队列丢帧。无状态边缘节点 RSS 目标严格小于 150MB；超限时仍如实报告实际测量值。
    InputConfig:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
          description: 手机 HTTP MJPEG / RTSP 地址或本地视频相对路径。
          minLength: 1
          example: http://192.168.10.12:8080/video
        loop:
          type: boolean
          default: false
        width:
          type: integer
          minimum: 1
          default: 640
        height:
          type: integer
          minimum: 1
          default: 480
        target_fps:
          type: number
          minimum: 0
          default: 15
          exclusiveMinimum: true
        dump_interval_sec:
          type: number
          minimum: 0
          default: 0
          description: Periodic JPEG dump interval in seconds; 0 disables dumping.
      required:
      - source
      - loop
      - width
      - height
      - target_fps
      - dump_interval_sec
    ModelCandidate:
      type: object
      additionalProperties: false
      properties:
        param:
          type: string
          minLength: 1
          example: models/yolo-fastest-v2-fp16.param
        bin:
          type: string
          minLength: 1
          example: models/yolo-fastest-v2-fp16.bin
      required:
      - param
      - bin
    DetectorConfig:
      type: object
      additionalProperties: false
      properties:
        motion_mad_threshold:
          type: number
          minimum: 0
          default: 8.0
          maximum: 255
        model_param:
          type: string
          example: models/yolo-fastest-v2.param
        model_bin:
          type: string
          example: models/yolo-fastest-v2.bin
        quantization:
          type: string
          enum:
          - auto
          - fp32
          - fp16
          - int8
          default: auto
          description: auto在设备支持int8且可用内存充足时选int8，其次fp16，否则使用基础模型。
        model_candidates:
          type: object
          additionalProperties: false
          properties:
            fp32:
              $ref: '#/components/schemas/ModelCandidate'
            fp16:
              $ref: '#/components/schemas/ModelCandidate'
            int8:
              $ref: '#/components/schemas/ModelCandidate'
          description: 可选的fp32/fp16/int8候选模型，param与bin须成对出现。
        input_size:
          type: integer
          minimum: 1
          default: 320
        conf_threshold:
          type: number
          minimum: 0
          default: 0.5
          maximum: 1
        num_threads:
          type: integer
          minimum: 1
          default: 2
        target_labels:
          type: array
          items:
            type: string
          example:
          - person
      required:
      - motion_mad_threshold
      - model_param
      - model_bin
      - input_size
      - conf_threshold
      - num_threads
      - target_labels
      - quantization
    EventConfig:
      type: object
      additionalProperties: false
      properties:
        end_grace_sec:
          type: number
          minimum: 0
          default: 5
      required:
      - end_grace_sec
      description: 仅保留活动事件结束宽限时间；边缘不保存历史事件表。
    LlmConfig:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: true
        endpoint:
          type: string
          format: uri
          example: http://192.168.10.10:8080/v1/chat/completions
        model:
          type: string
          example: vlm-local
          description: 未量化或回退时使用的 llama-server 模型别名。
        quantization:
          type: string
          enum:
          - auto
          - q8
          - q5
          - q4
          - none
          default: auto
          description: 量化档位偏好；auto 依次尝试 q8、q5、q4，不可用时回退 model。
        model_candidates:
          type: object
          description: 量化档位到 llama-server 模型别名的映射，仅允许这五个档位键。
          additionalProperties: false
          properties:
            auto:
              type: string
              minLength: 1
            q8:
              type: string
              minLength: 1
            q5:
              type: string
              minLength: 1
            q4:
              type: string
              minLength: 1
            none:
              type: string
              minLength: 1
          example:
            q8: vlm-local-q8
            q5: vlm-local-q5
            q4: vlm-local-q4
        prompt:
          type: string
          example: 用一句简短的中文描述画面中人物正在做什么。
        cooldown_sec:
          type: number
          minimum: 0
          default: 15
        connect_timeout_sec:
          type: number
          minimum: 0
          default: 3
          exclusiveMinimum: true
        read_timeout_sec:
          type: number
          minimum: 0
          default: 25
          exclusiveMinimum: true
        jpeg_quality:
          type: integer
          minimum: 1
          default: 70
          maximum: 100
      required:
      - enabled
      - endpoint
      - model
      - prompt
      - cooldown_sec
      - connect_timeout_sec
      - read_timeout_sec
      - jpeg_quality
    StreamerConfig:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - mjpeg
          - rtsp
          default: mjpeg
        http_port:
          type: integer
          minimum: 1
          default: 8081
          maximum: 65535
        rtsp_url:
          type: string
          format: uri
          example: rtsp://127.0.0.1:8554/edge
      required:
      - mode
      - http_port
      - rtsp_url
    Config:
      type: object
      additionalProperties: false
      properties:
        input:
          $ref: '#/components/schemas/InputConfig'
        detector:
          $ref: '#/components/schemas/DetectorConfig'
        event:
          $ref: '#/components/schemas/EventConfig'
        llm:
          $ref: '#/components/schemas/LlmConfig'
        streamer:
          $ref: '#/components/schemas/StreamerConfig'
        storage:
          $ref: '#/components/schemas/StorageConfig'
      required:
      - input
      - detector
      - event
      - llm
      - streamer
      - storage
      description: 当前生效配置，字段覆盖config/config.example.json；运行参数来自被Git忽略的config/config.local.json。
    DetectorPatch:
      type: object
      additionalProperties: false
      properties:
        motion_mad_threshold:
          type: number
          minimum: 0
          maximum: 255
        conf_threshold:
          type: number
          minimum: 0
          maximum: 1
      minProperties: 1
    LlmPatch:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        cooldown_sec:
          type: number
          minimum: 0
      minProperties: 1
    ConfigPatch:
      type: object
      additionalProperties: false
      properties:
        detector:
          $ref: '#/components/schemas/DetectorPatch'
        llm:
          $ref: '#/components/schemas/LlmPatch'
        storage:
          $ref: '#/components/schemas/StoragePatch'
      description: 仅允许检测2项、LLM2项与storage.enabled共5个叶子字段。先验证整份请求，再原子发布新配置快照；无效字段、未知字段、空对象或越界值返回400，不改变生效配置。storage.endpoint/timeout_sec仅从静态配置读取。
      minProperties: 1
    SourceSwitchRequest:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
          minLength: 1
          example: assets/demo_clip.mp4
        loop:
          type: boolean
          example: true
      required:
      - source
      - loop
    SourceSwitchResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - switched
        source:
          type: string
          example: assets/demo_clip.mp4
        loop:
          type: boolean
          example: true
      required:
      - status
      - source
      - loop
    TargetBox:
      type: object
      additionalProperties: false
      properties:
        class_id:
          type: integer
          minimum: 0
          example: 0
        label:
          type: string
          example: person
        score:
          type: number
          minimum: 0
          maximum: 1
          example: 0.87
        x:
          type: number
          minimum: 0
          maximum: 1
          example: 0.21
        y:
          type: number
          minimum: 0
          maximum: 1
          example: 0.15
        w:
          type: number
          minimum: 0
          maximum: 1
          example: 0.3
        h:
          type: number
          minimum: 0
          maximum: 1
          example: 0.68
      required:
      - label
      - score
      - x
      - y
      - w
      - h
      description: 检测框坐标相对画面归一化为 [0,1]，x/y 为左上角。
    StorageConfig:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: true
        endpoint:
          type: string
          description: 仅静态配置的事件接收完整URL。
          format: uri
          example: http://192.168.10.10:8090/api/v1/events
        timeout_sec:
          type: number
          minimum: 0
          default: 5
          exclusiveMinimum: true
      required:
      - enabled
      - endpoint
      - timeout_sec
    StoragePatch:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: v0.3-nous 起支持，仅切换存储投递开关。
      minProperties: 1
    CreateEventRequest:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          description: 仅允许字母、数字、下划线和连字符，由服务端据此生成文件名；不接受路径。
          pattern: ^[A-Za-z0-9_-]+$
          minLength: 1
          example: evt_1795412000_1
        frame_id:
          type: integer
          minimum: 0
          format: int64
          example: 88210
        timestamp_ms:
          type: integer
          minimum: 0
          format: int64
          example: 1795412000123
          maximum: 9223372036854775807
          description: 必填的非负int64 Unix毫秒。0合法；缺失、负值、错误类型（含布尔/非整数）或超出int64范围返回400。早于1735689600000（2025-01-01T00:00:00Z）或晚于9999-12-31T23:59:59.999Z的合法整数使用PC接收时间，其余保留原值。
        top_label:
          type: string
          example: person
        top_score:
          type: number
          minimum: 0
          maximum: 1
          example: 0.87
        targets:
          type: array
          items:
            $ref: '#/components/schemas/TargetBox'
        llm_summary:
          type: string
          description: LLM关闭、失败或超时时使用空字符串，存储仍继续。
          example: 一名男子正经过客厅走向门口。
        llm_latency_ms:
          type: number
          minimum: 0
          example: 5840.2
        image_base64:
          type: string
          description: 同一份未经OSD绘制的干净JPEG的Base64原文，不带data:image/jpeg;base64,前缀；禁止传入图片路径。
          format: byte
          minLength: 1
          example: <CLEAN_JPEG_BASE64>
      required:
      - event_id
      - frame_id
      - timestamp_ms
      - top_label
      - top_score
      - targets
      - llm_summary
      - llm_latency_ms
      - image_base64
      description: 字段与PATCH-003一致。服务端解码干净JPEG后存盘，事件字段写入SQLite；image_rel_path以storage/为根，形式为images/YYYY-MM-DD/<event_id>.jpg。字段映射见cloud-storage/schema.sql。
    CreateEventResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - created
        event_id:
          type: string
          description: 仅允许字母、数字、下划线和连字符，由服务端据此生成文件名；不接受路径。
          pattern: ^[A-Za-z0-9_-]+$
          minLength: 1
          example: evt_1795412000_1
        image_url:
          type: string
          description: 相对cloud-storage服务根地址的可访问资源URL，不返回宿主机绝对路径。
          example: /api/v1/images/2026-11-23/evt_1795412000_1.jpg
      required:
      - status
      - event_id
      - image_url
    StoredEvent:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          description: 仅允许字母、数字、下划线和连字符，由服务端据此生成文件名；不接受路径。
          pattern: ^[A-Za-z0-9_-]+$
          minLength: 1
          example: evt_1795412000_1
        frame_id:
          type: integer
          minimum: 0
          format: int64
          example: 88210
        timestamp_ms:
          type: integer
          minimum: 0
          format: int64
          example: 1795412000123
          maximum: 9223372036854775807
          description: 入库前一次确定的有效Unix毫秒，已完成未对时兜底；SQLite、历史返回/排序及图片UTC日期使用同一个值。早于2025-01-01或无法形成四位年份日期的合法入站值改用PC接收时间。
        top_label:
          type: string
          example: person
        top_score:
          type: number
          minimum: 0
          maximum: 1
          example: 0.87
        targets:
          type: array
          items:
            $ref: '#/components/schemas/TargetBox'
        llm_summary:
          type: string
          description: LLM关闭、失败或超时时使用空字符串，存储仍继续。
          example: 一名男子正经过客厅走向门口。
        llm_latency_ms:
          type: number
          minimum: 0
          example: 5840.2
        image_url:
          type: string
          description: 相对cloud-storage服务根地址的可访问资源URL，不返回宿主机绝对路径。
          example: /api/v1/images/2026-11-23/evt_1795412000_1.jpg
        created_at:
          type: string
          description: SQLite CURRENT_TIMESTAMP生成的UTC入库时间，格式YYYY-MM-DD HH:MM:SS。
          example: '2026-11-23 05:33:20'
      required:
      - event_id
      - frame_id
      - timestamp_ms
      - top_label
      - top_score
      - targets
      - llm_summary
      - llm_latency_ms
      - image_url
      - created_at
      description: 历史结构化事件。timestamp_ms为入库时已经确定的有效时间；图片日期和列表排序使用相同值。targets由SQLite targets_json解析，image_url由image_rel_path生成，不返回图片Base64或磁盘路径。
    StoredEventsResponse:
      type: object
      additionalProperties: false
      properties:
        total:
          type: integer
          minimum: 0
          format: int64
          example: 1
        limit:
          type: integer
          minimum: 1
          default: 20
          maximum: 100
        offset:
          type: integer
          minimum: 0
          default: 0
        events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/StoredEvent'
      required:
      - total
      - limit
      - offset
      - events
    StorageHealth:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ok
        db:
          type: string
          enum:
          - connected
      required:
      - status
      - db
    LogRecord:
      type: object
      additionalProperties: true
      description: 原始结构化日志对象，完整保留全部JSON字段及结构。不强制date、MESSAGE或_SYSTEMD_UNIT；时间字段和值格式由实际Fluent Bit模板决定。
      example:
        date: '2026-11-23T05:33:20.123Z'
        MESSAGE: 采集节点已启动
        _SYSTEMD_UNIT: edge-vision.service
    LogBatch:
      type: array
      items:
        $ref: '#/components/schemas/LogRecord'
      description: Fluent Bit HTTP output Format json提交的对象数组；不接收单个对象或原始NDJSON请求。
  responses:
    BadRequest:
      description: 请求字段、参数范围、Base64/JPEG、图片路径、源初始化错误或录制中切源；切源失败保留原源，重复事件ID返回EVENT_EXISTS。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 请求资源或路径不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 服务内部错误，例如文件或SQLite写入失败；采用统一Error且不暴露磁盘路径。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: 边缘首帧/节点或Storage数据库暂未就绪。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
